name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  id-token: write
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: terraform apply
        working-directory: infra
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "RG=$(terraform output -raw resource_group)" >> "$GITHUB_ENV"
          echo "API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          echo "APP=$(terraform output -raw app_name)" >> "$GITHUB_ENV"
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
      - name: nieuwe image op de Container App (Terraform negeert de image na de eerste apply)
        run: |
          az containerapp update -g "$RG" -n "$APP" --image "${IMAGE}:${{ github.sha }}"
      - name: smoke
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$API_URL/healthz"
          curl -fsS --retry 3 --retry-delay 5 "$API_URL/" | grep -q "Sociale kaart"
