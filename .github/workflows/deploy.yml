name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  id-token: write
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: terraform apply
        working-directory: infra
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "RG=$(terraform output -raw resource_group)" >> "$GITHUB_ENV"
          echo "API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
      - name: nieuwe image op de Container App (Terraform negeert de image na de eerste apply)
        run: |
          APP=$(az containerapp list -g "$RG" --query '[0].name' -o tsv)
          az containerapp update -g "$RG" -n "$APP" --image "${IMAGE}:${{ github.sha }}"
      - name: smoke
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$API_URL/healthz"
